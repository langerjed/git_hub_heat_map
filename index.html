const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

const LEVEL = { NONE: 'l0', FIRST_QUARTILE: 'l1', SECOND_QUARTILE: 'l2', THIRD_QUARTILE: 'l3', FOURTH_QUARTILE: 'l4' };
const NUMBER = new Intl.NumberFormat('en-US');
const TIME_ZONE = DATA.timeZone || 'America/New_York';
const DATE_TIME_FORMATTER = new Intl.DateTimeFormat('en-US', {
  timeZone: TIME_ZONE,
  year: 'numeric',
  month: 'numeric',
  day: 'numeric',
  hour: 'numeric',
  minute: '2-digit',
  second: '2-digit',
});
const DAY_KEY_FORMATTER = new Intl.DateTimeFormat('en-CA', {
  timeZone: TIME_ZONE,
  year: 'numeric',
  month: '2-digit',
  day: '2-digit',
});
const TOOLTIP_FORMATTER = new Intl.DateTimeFormat('en-US', {
  timeZone: TIME_ZONE,
  weekday: 'short',
  month: 'short',
  day: 'numeric',
  year: 'numeric',
});

function fmtNumber(value) {
  return NUMBER.format(value || 0);
}

function fmtDate(value) {
  return DATE_TIME_FORMATTER.format(new Date(value));
}

function relativeDate(value) {
  const ms = Date.now() - new Date(value).getTime();
  const hours = Math.round(ms / 36e5);
  if (hours < 24) return `${hours}h ago`;
  const days = Math.round(hours / 24);
  return `${days}d ago`;
}

function parseDayKey(dayKey) {
  return new Date(`${dayKey}T12:00:00-04:00`);
}

function easternDayKey(value) {
  return DAY_KEY_FORMATTER.format(value);
}

function render() {
  const el = document.getElementById('content');
  el.innerHTML = '';
  const years = DATA.years || DATA;
  const syncStatus = document.getElementById('sync-status');
  if (DATA.syncedAt) {
    const syncedAt = new Date(DATA.syncedAt);
    syncStatus.textContent = `Last synced ${fmtDate(syncedAt)} ET`;
  } else {
    syncStatus.textContent = 'Showing saved snapshot';
  }
  renderSummary();
  // Process each year
  for (const [year, cal] of Object.entries(years).sort((a, b) => b[0] - a[0])) {
    // Flatten all days and group by month
    const allDays = Array.isArray(cal.days)
      ? cal.days
      : (cal.weeks || []).flatMap((week) => week.contributionDays || []);

    // For a full year, generate all dates
    const fullDays = {};
    const y = parseInt(year);
    const start = parseDayKey(`${year}-01-01`);
    const end = parseDayKey(`${year}-12-31`);
    for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
      const key = easternDayKey(d);
      fullDays[key] = { date: key, contributionCount: 0, contributionLevel: 'NONE' };
    }
    // Overlay actual data
    for (const day of allDays) {
      fullDays[day.date] = day;
    }

    // Group by month
    const byMonth = {};
    for (const [key, day] of Object.entries(fullDays)) {
      const m = parseInt(key.slice(5, 7)) - 1;
      if (!byMonth[m]) byMonth[m] = [];
      byMonth[m].push(day);
    }
    // Sort each month
    for (const m of Object.keys(byMonth)) {
      byMonth[m].sort((a, b) => a.date.localeCompare(b.date));
    }

    const section = document.createElement('div');
    section.className = 'year-section';
    const noun = DATA.heatmapMode === 'all-commits' ? 'commits' : 'contributions';
    section.innerHTML = `<div class="year-header"><h2>${year}</h2><div class="count"><span>${cal.totalContributions.toLocaleString()}</span> ${noun}</div></div>`;

    const grid = document.createElement('div');
    grid.className = 'months-grid';

    for (let m = 0; m < 12; m++) {
      const days = byMonth[m];
      if (!days) continue;

      // Skip future months with no data
      const now = new Date();
      const easternNow = easternDayKey(now);
      const nowYear = Number.parseInt(easternNow.slice(0, 4), 10);
      const nowMonth = Number.parseInt(easternNow.slice(5, 7), 10) - 1;
      if (y > nowYear || (y === nowYear && m > nowMonth)) continue;

      const card = document.createElement('div');
      card.className = 'month-card';

      const total = days.reduce((s, d) => s + d.contributionCount, 0);
      const label = document.createElement('div');
      label.className = 'month-label';
      label.innerHTML = `${MONTHS[m]} <span class="mc">${total}</span>`;
      card.appendChild(label);

      const dg = document.createElement('div');
      dg.className = 'day-grid';

      DAYS.forEach(d => {
        const lbl = document.createElement('div');
        lbl.className = 'dl';
        lbl.textContent = d;
        dg.appendChild(lbl);
      });

      // Empty padding before first day
      const firstDate = parseDayKey(days[0].date);
      const dow = firstDate.getDay();
      for (let i = 0; i < dow; i++) {
        const empty = document.createElement('div');
        empty.className = 'd e';
        dg.appendChild(empty);
      }

      days.forEach(day => {
        const cell = document.createElement('div');
        cell.className = `d ${LEVEL[day.contributionLevel] || 'l0'}`;
        cell.dataset.c = day.contributionCount;
        cell.dataset.d = day.date;
        cell.addEventListener('mouseenter', showTip);
        cell.addEventListener('mouseleave', hideTip);
        dg.appendChild(cell);
      });

      card.appendChild(dg);
      grid.appendChild(card);
    }

    section.appendChild(grid);
    el.appendChild(section);
  }
}

const tip = document.getElementById('tip');
const refreshBtn = document.getElementById('refresh-btn');
function showTip(e) {
  const c = e.target.dataset.c;
  const dt = parseDayKey(e.target.dataset.d);
  const fmt = TOOLTIP_FORMATTER.format(dt);
  tip.innerHTML = `<b>${c === '0' ? 'No contributions' : c + ' contribution' + (c === '1' ? '' : 's')}</b><br><span class="td">${fmt}</span>`;
  tip.style.display = 'block';
  const r = e.target.getBoundingClientRect();
  tip.style.left = (r.left + r.width / 2 - tip.offsetWidth / 2) + 'px';
  tip.style.top = (r.top - tip.offsetHeight - 8) + 'px';
}
function hideTip() { tip.style.display = 'none'; }

refreshBtn.addEventListener('click', () => {
  window.location.reload();
});

render();
</script>
</body>
</html>
