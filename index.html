const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DAYS = ['S','M','T','W','T','F','S'];
const LEVEL = { NONE: 'l0', FIRST_QUARTILE: 'l1', SECOND_QUARTILE: 'l2', THIRD_QUARTILE: 'l3', FOURTH_QUARTILE: 'l4' };

function render() {
  const el = document.getElementById('content');
  const years = DATA.years || DATA;
  const syncStatus = document.getElementById('sync-status');
  if (DATA.syncedAt) {
    const syncedAt = new Date(DATA.syncedAt);
    syncStatus.textContent = `Last synced ${syncedAt.toLocaleString()}`;
  } else {
    syncStatus.textContent = 'Showing saved snapshot';
  }
  // Process each year
  for (const [year, cal] of Object.entries(years).sort((a, b) => b[0] - a[0])) {
    // Flatten all days and group by month
    const allDays = Array.isArray(cal.days)
      ? cal.days
      : (cal.weeks || []).flatMap((week) => week.contributionDays || []);

    // For a full year, generate all dates
    const fullDays = {};
    const y = parseInt(year);
    const start = new Date(y, 0, 1);
    const end = new Date(y, 11, 31);
    for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
      const key = d.toISOString().slice(0, 10);
      fullDays[key] = { date: key, contributionCount: 0, contributionLevel: 'NONE' };
    }
    // Overlay actual data
    for (const day of allDays) {
      fullDays[day.date] = day;
    }

    // Group by month
    const byMonth = {};
    for (const [key, day] of Object.entries(fullDays)) {
      const m = parseInt(key.slice(5, 7)) - 1;
      if (!byMonth[m]) byMonth[m] = [];
      byMonth[m].push(day);
    }
    // Sort each month
    for (const m of Object.keys(byMonth)) {
      byMonth[m].sort((a, b) => a.date.localeCompare(b.date));
    }

    const section = document.createElement('div');
    section.className = 'year-section';
    section.innerHTML = `<div class="year-header"><h2>${year}</h2><div class="count"><span>${cal.totalContributions.toLocaleString()}</span> contributions</div></div>`;

    const grid = document.createElement('div');
    grid.className = 'months-grid';

    for (let m = 0; m < 12; m++) {
      const days = byMonth[m];
      if (!days) continue;

      // Skip future months with no data
      const now = new Date();
      if (y > now.getFullYear() || (y === now.getFullYear() && m > now.getMonth())) continue;

      const card = document.createElement('div');
      card.className = 'month-card';

      const total = days.reduce((s, d) => s + d.contributionCount, 0);
      const label = document.createElement('div');
      label.className = 'month-label';
      label.innerHTML = `${MONTHS[m]} <span class="mc">${total}</span>`;
      card.appendChild(label);

      const dg = document.createElement('div');
      dg.className = 'day-grid';

      DAYS.forEach(d => {
        const lbl = document.createElement('div');
        lbl.className = 'dl';
        lbl.textContent = d;
        dg.appendChild(lbl);
      });

      // Empty padding before first day
      const firstDate = new Date(days[0].date + 'T00:00:00');
      const dow = firstDate.getDay();
      for (let i = 0; i < dow; i++) {
        const empty = document.createElement('div');
        empty.className = 'd e';
        dg.appendChild(empty);
      }

      days.forEach(day => {
        const cell = document.createElement('div');
        cell.className = `d ${LEVEL[day.contributionLevel] || 'l0'}`;
        cell.dataset.c = day.contributionCount;
        cell.dataset.d = day.date;
        cell.addEventListener('mouseenter', showTip);
        cell.addEventListener('mouseleave', hideTip);
        dg.appendChild(cell);
      });

      card.appendChild(dg);
      grid.appendChild(card);
    }

    section.appendChild(grid);
    el.appendChild(section);
  }
}

const tip = document.getElementById('tip');
function showTip(e) {
  const c = e.target.dataset.c;
  const dt = new Date(e.target.dataset.d + 'T00:00:00');
  const fmt = dt.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
  tip.innerHTML = `<b>${c === '0' ? 'No contributions' : c + ' contribution' + (c === '1' ? '' : 's')}</b><br><span class="td">${fmt}</span>`;
  tip.style.display = 'block';
  const r = e.target.getBoundingClientRect();
  tip.style.left = (r.left + r.width / 2 - tip.offsetWidth / 2) + 'px';
  tip.style.top = (r.top - tip.offsetHeight - 8) + 'px';
}
function hideTip() { tip.style.display = 'none'; }

render();
</script>
