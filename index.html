const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DAYS = ['S','M','T','W','T','F','S'];
const LEVEL = { NONE: 'l0', FIRST_QUARTILE: 'l1', SECOND_QUARTILE: 'l2', THIRD_QUARTILE: 'l3', FOURTH_QUARTILE: 'l4' };
const NUMBER = new Intl.NumberFormat('en-US');

function fmtNumber(value) {
  return NUMBER.format(value || 0);
}

function fmtDate(value) {
  return new Date(value).toLocaleString();
}

function relativeDate(value) {
  const ms = Date.now() - new Date(value).getTime();
  const hours = Math.round(ms / 36e5);
  if (hours < 24) return `${hours}h ago`;
  const days = Math.round(hours / 24);
  return `${days}d ago`;
}

function renderSummary() {
  const aggregate = DATA.aggregate;
  if (!aggregate) return;

  const summary = document.getElementById('summary');
  const recentRepos = (aggregate.repos && aggregate.repos.recent) || [];
  const recentPushes = (aggregate.events && aggregate.events.recentPushes) || [];
  const recentCommits = (aggregate.recentCommits && aggregate.recentCommits.commits) || [];
  const contributionSummary = aggregate.contributionSummary || null;
  const contributionRepos = (contributionSummary && contributionSummary.topContributionRepos) || [];
  const contributionNote = contributionSummary
    ? (contributionSummary.hasRestricted
      ? `Includes ${fmtNumber(contributionSummary.restrictedCount)} restricted contribution${contributionSummary.restrictedCount === 1 ? '' : 's'} that GitHub can count without exposing repo details publicly.`
      : 'Authenticated contribution totals are available for your account.')
    : 'Token-backed contribution totals are unavailable in this sync.';
  const heatmapMode = DATA.heatmapMode === 'all-commits'
    ? 'The heatmap below now shows all commits by day across your repos, not just GitHub profile-counted contributions.'
    : 'The heatmap below shows GitHub’s official profile contribution calendar.';

  summary.innerHTML = `
    <section class="panel">
      <h2>All GitHub Activity</h2>
      <div class="panel-copy">${aggregate.note}</div>
      <div class="stat-grid">
        <div class="stat-card">
          <div class="stat-label">Owned repos</div>
          <div class="stat-value">${fmtNumber(aggregate.repos.totalOwned)}</div>
          <div class="stat-meta">${fmtNumber(aggregate.repos.publicOwned)} public${aggregate.scope === 'token' ? `, ${fmtNumber(aggregate.repos.privateOwned)} private` : ''}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">PRs opened</div>
          <div class="stat-value">${fmtNumber(aggregate.pulls.opened)}</div>
          <div class="stat-meta">${fmtNumber(aggregate.pulls.merged)} merged</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Official commit contributions</div>
          <div class="stat-value">${fmtNumber(contributionSummary ? contributionSummary.totals.commits : 0)}</div>
          <div class="stat-meta">${contributionNote}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Issues opened</div>
          <div class="stat-value">${fmtNumber(aggregate.issues.opened)}</div>
          <div class="stat-meta">Across your visible repos</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">PR reviews</div>
          <div class="stat-value">${fmtNumber(contributionSummary ? contributionSummary.totals.reviews : 0)}</div>
          <div class="stat-meta">${fmtNumber(contributionSummary ? contributionSummary.totals.pullRequests : 0)} official PR contributions</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Recent public pushes</div>
          <div class="stat-value">${fmtNumber(aggregate.events.publicPushEvents)}</div>
          <div class="stat-meta">${fmtNumber(aggregate.events.publicPushCommits)} commits in recent public push events</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Recent commits</div>
          <div class="stat-value">${fmtNumber(aggregate.recentCommits.totalRecentCommits)}</div>
          <div class="stat-meta">${aggregate.recentCommits.note}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Repos touched recently</div>
          <div class="stat-value">${fmtNumber(aggregate.events.reposTouched)}</div>
          <div class="stat-meta">Based on GitHub's public events feed</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Stars across owned repos</div>
          <div class="stat-value">${fmtNumber(aggregate.repos.totalStars)}</div>
          <div class="stat-meta">${fmtNumber(aggregate.repos.totalForks)} forks</div>
        </div>
      </div>
      <div class="split-grid">
        <section class="list-card">
          <h3>Recently Updated Repos</h3>
          <div class="mini-list">
            ${recentRepos.map((repo) => `
              <div class="mini-item">
                <div class="mini-main">
                  <a href="${repo.url}" target="_blank" rel="noreferrer">${repo.name}</a>
                  <div class="mini-sub">${repo.language || 'No language set'} · ${repo.visibility}${repo.description ? ` · ${repo.description}` : ''}</div>
                </div>
                <div class="mini-side">${relativeDate(repo.pushedAt)}</div>
              </div>
            `).join('')}
          </div>
        </section>
        <section class="list-card">
          <h3>Recent Public Pushes</h3>
          <div class="mini-list">
            ${recentPushes.map((push) => `
              <div class="mini-item">
                <div class="mini-main">
                  <a href="${push.url}" target="_blank" rel="noreferrer">${push.repo}</a>
                  <div class="mini-sub">${push.branch || 'unknown branch'} · ${push.commits} commit${push.commits === 1 ? '' : 's'}</div>
                </div>
                <div class="mini-side">${relativeDate(push.createdAt)}</div>
              </div>
            `).join('')}
          </div>
        </section>
        <section class="list-card">
          <h3>Recent Commits</h3>
          <div class="mini-list">
            ${recentCommits.map((commit) => `
              <div class="mini-item">
                <div class="mini-main">
                  <a href="${commit.url}" target="_blank" rel="noreferrer">${commit.repo}</a>
                  <div class="mini-sub">${commit.sha} · ${commit.message}</div>
                </div>
                <div class="mini-side">${relativeDate(commit.committedAt)}</div>
              </div>
            `).join('')}
          </div>
        </section>
        <section class="list-card">
          <h3>Top Contribution Repos</h3>
          <div class="mini-list">
            ${contributionRepos.map((repo) => `
              <div class="mini-item">
                <div class="mini-main">
                  <a href="${repo.url}" target="_blank" rel="noreferrer">${repo.name}</a>
                  <div class="mini-sub">${repo.language || 'No language set'} · ${repo.visibility}</div>
                </div>
                <div class="mini-side">${fmtNumber(repo.commits)} commit${repo.commits === 1 ? '' : 's'}</div>
              </div>
            `).join('')}
          </div>
        </section>
      </div>
    </section>
    <section class="panel">
      <h2>Commit Heatmap</h2>
      <div class="panel-copy">${heatmapMode}</div>
    </section>
  `;
}

function render() {
  const el = document.getElementById('content');
  const years = DATA.years || DATA;
  const syncStatus = document.getElementById('sync-status');
  if (DATA.syncedAt) {
    const syncedAt = new Date(DATA.syncedAt);
    syncStatus.textContent = `Last synced ${syncedAt.toLocaleString()}`;
  } else {
    syncStatus.textContent = 'Showing saved snapshot';
  }
  renderSummary();
  // Process each year
  for (const [year, cal] of Object.entries(years).sort((a, b) => b[0] - a[0])) {
    // Flatten all days and group by month
    const allDays = Array.isArray(cal.days)
      ? cal.days
      : (cal.weeks || []).flatMap((week) => week.contributionDays || []);

    // For a full year, generate all dates
    const fullDays = {};
    const y = parseInt(year);
    const start = new Date(y, 0, 1);
    const end = new Date(y, 11, 31);
    for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
      const key = d.toISOString().slice(0, 10);
      fullDays[key] = { date: key, contributionCount: 0, contributionLevel: 'NONE' };
    }
    // Overlay actual data
    for (const day of allDays) {
      fullDays[day.date] = day;
    }

    // Group by month
    const byMonth = {};
    for (const [key, day] of Object.entries(fullDays)) {
      const m = parseInt(key.slice(5, 7)) - 1;
      if (!byMonth[m]) byMonth[m] = [];
      byMonth[m].push(day);
    }
    // Sort each month
    for (const m of Object.keys(byMonth)) {
      byMonth[m].sort((a, b) => a.date.localeCompare(b.date));
    }

    const section = document.createElement('div');
    section.className = 'year-section';
    const noun = DATA.heatmapMode === 'all-commits' ? 'commits' : 'contributions';
    section.innerHTML = `<div class="year-header"><h2>${year}</h2><div class="count"><span>${cal.totalContributions.toLocaleString()}</span> ${noun}</div></div>`;

    const grid = document.createElement('div');
    grid.className = 'months-grid';

    for (let m = 0; m < 12; m++) {
      const days = byMonth[m];
      if (!days) continue;

      // Skip future months with no data
      const now = new Date();
      if (y > now.getFullYear() || (y === now.getFullYear() && m > now.getMonth())) continue;

      const card = document.createElement('div');
      card.className = 'month-card';

      const total = days.reduce((s, d) => s + d.contributionCount, 0);
      const label = document.createElement('div');
      label.className = 'month-label';
      label.innerHTML = `${MONTHS[m]} <span class="mc">${total}</span>`;
      card.appendChild(label);

      const dg = document.createElement('div');
      dg.className = 'day-grid';

      DAYS.forEach(d => {
        const lbl = document.createElement('div');
        lbl.className = 'dl';
        lbl.textContent = d;
        dg.appendChild(lbl);
      });

      // Empty padding before first day
      const firstDate = new Date(days[0].date + 'T00:00:00');
      const dow = firstDate.getDay();
      for (let i = 0; i < dow; i++) {
        const empty = document.createElement('div');
        empty.className = 'd e';
        dg.appendChild(empty);
      }

      days.forEach(day => {
        const cell = document.createElement('div');
        cell.className = `d ${LEVEL[day.contributionLevel] || 'l0'}`;
        cell.dataset.c = day.contributionCount;
        cell.dataset.d = day.date;
        cell.addEventListener('mouseenter', showTip);
        cell.addEventListener('mouseleave', hideTip);
        dg.appendChild(cell);
      });

      card.appendChild(dg);
      grid.appendChild(card);
    }

    section.appendChild(grid);
    el.appendChild(section);
  }
}

const tip = document.getElementById('tip');
function showTip(e) {
  const c = e.target.dataset.c;
  const dt = new Date(e.target.dataset.d + 'T00:00:00');
  const fmt = dt.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
  tip.innerHTML = `<b>${c === '0' ? 'No contributions' : c + ' contribution' + (c === '1' ? '' : 's')}</b><br><span class="td">${fmt}</span>`;
  tip.style.display = 'block';
  const r = e.target.getBoundingClientRect();
  tip.style.left = (r.left + r.width / 2 - tip.offsetWidth / 2) + 'px';
  tip.style.top = (r.top - tip.offsetHeight - 8) + 'px';
}
function hideTip() { tip.style.display = 'none'; }

render();
